<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-vibrant Royal Blue to Electric Sky Blue -->
    <linearGradient id="favBlueV" x1="22" y1="4" x2="22" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="50%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
    <linearGradient id="favBlueH" x1="4" y1="22" x2="40" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Luminous High-Contrast Blue Medical Cross -->
  <!-- Vertical Bar: Brilliant Electric Blue with Light Blue Border for Dark Tab Visibility -->
  <rect x="17" y="4" width="10" height="36" rx="5" fill="url(#favBlueV)" stroke="#60a5fa" stroke-width="1.4" />
  
  <!-- Horizontal Bar: Brilliant Azure / Sky Blue -->
  <rect x="4" y="17" width="36" height="10" rx="5" fill="url(#favBlueH)" stroke="#93c5fd" stroke-width="1.4" />
  
  <!-- Central Vital Node: Crisp White for Tab Contrast -->
  <circle cx="22" cy="22" r="3.2" fill="#ffffff" />
  
  <!-- Precision Health Beacon: Luminous Cyan -->
  <circle cx="36" cy="9" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
</svg>
